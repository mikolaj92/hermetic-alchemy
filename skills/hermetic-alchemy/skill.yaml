name: hermetic-alchemy
version: 1.0.2
description: Multi-agent orchestration through alchemical transformation. The Magnum
  Opus workflow through 8 specialized child agents coordinated by the host. Trigger
  by typing /transmute [project] or /hermetic [project]. Spawns Nigredo (analysis),
  Citrinitas (design), Mercurius (backend), Sol (frontend), Sal (database), Albedo
  (refinement), Sulfur (quality), and Rubedo (final); the host is Hermes Trismegistus
  for autonomous software development with feedback loops. Use when the user wants
  to transmute, forge, or create software.
author: Mikołaj (mikolaj92)
